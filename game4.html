<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Car Dodge - Coin Rush</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #050711;
    overflow: hidden;
    font-family: Arial, sans-serif;
    user-select: none;
}

#game {
    display: block;
    margin: auto;
    background: #20242f;
    border: 3px solid #00e5ff;
    box-shadow: 0 0 25px #00e5ff;
}

#ui {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: min(95%, 500px);
    display: flex;
    justify-content: space-between;
    z-index: 5;
    color: white;
    font-size: 17px;
    font-weight: bold;
    text-shadow: 0 0 8px #00e5ff;
}

#message {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(90%, 380px);
    padding: 30px;
    text-align: center;
    background: rgba(5, 7, 17, 0.96);
    border: 2px solid #00e5ff;
    border-radius: 20px;
    color: white;
    display: none;
    z-index: 20;
    box-shadow: 0 0 30px #00e5ff;
}

#message h1 {
    color: #ff367f;
    font-size: 38px;
    margin-bottom: 15px;
}

#message p {
    margin: 8px;
    font-size: 20px;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 14px 25px;
    margin-top: 15px;
    background: #00e5ff;
    color: #001014;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 15px #00e5ff;
}

#controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 30px;
    z-index: 10;
}

.control {
    width: 80px;
    height: 60px;
    padding: 0;
    font-size: 28px;
    touch-action: none;
}

@media (min-width: 700px) {
    #controls {
        display: none;
    }
}

#topButtons {
    position: fixed;
    top: 48px;
    right: 12px;
    display: flex;
    gap: 8px;
    z-index: 30;
}
#topButtons button {
    margin: 0;
    padding: 9px 12px;
    font-size: 17px;
    border-radius: 10px;
}
#shop {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(92%, 360px);
    padding: 22px;
    background: rgba(5,7,17,.98);
    border: 2px solid #ffd700;
    border-radius: 20px;
    color: white;
    z-index: 40;
    box-shadow: 0 0 30px #ffd700;
    display: none;
    text-align: center;
}
#shop h2 { color: #ffd700; margin-bottom: 10px; }
#shop .upgrade, #closeShop {
    display: block;
    width: 100%;
    margin: 10px 0 0;
}
#pauseOverlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 25;
    color: white;
    font-size: 42px;
    font-weight: bold;
    background: rgba(0,0,0,.42);
    text-shadow: 0 0 15px #00e5ff;
    pointer-events: none;
}
#ui { flex-wrap: wrap; gap: 8px; }

</style>
</head>

<body>
<div id="pauseOverlay">⏸️ PAUSED</div>

<div id="ui">
    <div>🏆 Score: <span id="score">0</span></div>
    <div>🪙 Coins: <span id="coins">0</span></div>
    <div>⭐ Best: <span id="best">0</span></div>
    <div>❤️ <span id="lives">3</span></div>
    <div>🏆 Lvl <span id="level">1</span></div>
</div>

<div id="topButtons">
    <button id="pauseBtn">⏸️</button>
    <button id="shopBtn">🛒</button>
</div>

<canvas id="game"></canvas>

<div id="shop">
    <h2>🛒 CAR SHOP</h2>
    <p>Coins: <span id="shopCoins">0</span></p>
    <button class="upgrade" data-upgrade="speed">🚗 Speed +2 — <span>25</span> 🪙</button>
    <button class="upgrade" data-upgrade="lives">❤️ Extra Life — <span>40</span> 🪙</button>
    <button class="upgrade" data-upgrade="shield">🛡️ Shield — <span>60</span> 🪙</button>
    <button id="closeShop">CLOSE</button>
</div>

<div id="message">
    <h1>💥 GAME OVER</h1>
    <p>🏆 Score: <span id="finalScore">0</span></p>
    <p>🪙 Coins: <span id="finalCoins">0</span></p>
    <p>🏆 Best: <span id="finalBest">0</span></p>
    <button id="restart">🔄 PLAY AGAIN</button>
</div>

<div id="controls">
    <button class="control" id="left">⬅️</button>
    <button class="control" id="right">➡️</button>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const coinsText = document.getElementById("coins");
const bestText = document.getElementById("best");

const message = document.getElementById("message");
const finalScore = document.getElementById("finalScore");
const finalCoins = document.getElementById("finalCoins");

const restart = document.getElementById("restart");
const livesText = document.getElementById("lives");
const levelText = document.getElementById("level");
const finalBest = document.getElementById("finalBest");
const pauseBtn = document.getElementById("pauseBtn");
const pauseOverlay = document.getElementById("pauseOverlay");
const shopBtn = document.getElementById("shopBtn");
const shop = document.getElementById("shop");
const closeShop = document.getElementById("closeShop");
const shopCoins = document.getElementById("shopCoins");

let W;
let H;

function resize() {

    W = Math.min(window.innerWidth, 500);
    H = window.innerHeight;

    if (H > 850) {
        H = 850;
    }

    canvas.width = W;
    canvas.height = H;
}

resize();

window.addEventListener("resize", resize);


let player;
let enemies;
let coinObjects;

let score;
let coins;
let lives;
let level;
let speed;
let spawnTimer;
let coinTimer;
let roadOffset;
let gameRunning;
let paused = false;
let shieldTimer = 0;
let speedBoostTimer = 0;
let invincibleTimer = 0;
let audioCtx = null;
let lastLevel = 1;

let upgradeSpeed = Number(localStorage.getItem("upgradeSpeed") || 0);
let upgradeLives = Number(localStorage.getItem("upgradeLives") || 0);
let upgradeShield = Number(localStorage.getItem("upgradeShield") || 0);

let best = Number(localStorage.getItem("neonBest") || 0);
let savedCoins = Number(localStorage.getItem("totalCoins") || 0);

bestText.textContent = best;


const keys = {
    left: false,
    right: false
};


function resetGame() {

    player = {
        x: W / 2 - 25,
        y: H - 150,
        width: 50,
        height: 90,
        speed: 8
    };

    enemies = [];
    coinObjects = [];

    score = 0;
    coins = 0;
    lives = Math.min(5, 3 + upgradeLives);
    level = 1;

    speed = 7 + upgradeSpeed * 1.5;
    spawnTimer = 0;
    coinTimer = 18;
    roadOffset = 0;

    paused = false;
    shieldTimer = upgradeShield > 0 ? 900 : 0;
    speedBoostTimer = 0;
    invincibleTimer = 0;
    lastLevel = 1;

    gameRunning = true;

    scoreText.textContent = "0";
    coinsText.textContent = "0";
    livesText.textContent = lives;
    levelText.textContent = level;
    pauseOverlay.style.display = "none";
    message.style.display = "none";

    requestAnimationFrame(gameLoop);
}


function drawBackground() {

    // Animated neon city background
    ctx.fillStyle = "#03050d";
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "#081b2b";
    for (let x = 0; x < W; x += 42) {
        const h = 25 + ((x * 17) % 90);
        ctx.fillRect(x, 40, 30, h);
        ctx.fillStyle = "#0b3040";
        ctx.fillRect(x + 5, 48, 5, 5);
        ctx.fillRect(x + 16, 62, 5, 5);
        ctx.fillStyle = "#081b2b";
    }

    // Road
    ctx.fillStyle = "#242833";

    ctx.fillRect(
        W * 0.15,
        0,
        W * 0.70,
        H
    );

    // Road borders
    ctx.fillStyle = "#00e5ff";

    ctx.fillRect(
        W * 0.15,
        0,
        5,
        H
    );

    ctx.fillRect(
        W * 0.85 - 5,
        0,
        5,
        H
    );

    // Lane lines
    ctx.strokeStyle = "#dce7ff";
    ctx.lineWidth = 5;

    ctx.setLineDash([35, 30]);
    ctx.lineDashOffset = roadOffset;

    ctx.beginPath();
    ctx.moveTo(W * 0.38, 0);
    ctx.lineTo(W * 0.38, H);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(W * 0.62, 0);
    ctx.lineTo(W * 0.62, H);
    ctx.stroke();

    ctx.setLineDash([]);
}


function drawCar(car, color) {

    // Shadow
    ctx.fillStyle = "rgba(0,0,0,0.45)";

    ctx.fillRect(
        car.x + 5,
        car.y + 8,
        car.width,
        car.height
    );

    // Car body
    ctx.fillStyle = color;

    ctx.beginPath();

    ctx.roundRect(
        car.x,
        car.y,
        car.width,
        car.height,
        10
    );

    ctx.fill();

    // Windows
    ctx.fillStyle = "#101522";

    ctx.beginPath();

    ctx.roundRect(
        car.x + 8,
        car.y + 12,
        car.width - 16,
        25,
        6
    );

    ctx.fill();

    ctx.beginPath();

    ctx.roundRect(
        car.x + 8,
        car.y + 48,
        car.width - 16,
        18,
        5
    );

    ctx.fill();

    // Headlights
    ctx.fillStyle = "#fff8a6";

    ctx.fillRect(
        car.x + 5,
        car.y + 5,
        10,
        7
    );

    ctx.fillRect(
        car.x + car.width - 15,
        car.y + 5,
        10,
        7
    );

    // Back lights
    ctx.fillStyle = "#ff1744";

    ctx.fillRect(
        car.x + 5,
        car.y + car.height - 12,
        10,
        7
    );

    ctx.fillRect(
        car.x + car.width - 15,
        car.y + car.height - 12,
        10,
        7
    );
}


function drawCoin(coin) {
    if (coin.powerup) {
        drawPowerUp(coin);
        return;
    }

    ctx.save();

    ctx.translate(
        coin.x + coin.size / 2,
        coin.y + coin.size / 2
    );

    const pulse =
        1 + Math.sin(coin.rotation * 5) * 0.08;

    ctx.scale(pulse, pulse);

    // Glow
    ctx.shadowColor = "#ffd700";
    ctx.shadowBlur = 18;

    // Outer coin
    ctx.fillStyle = "#ffd700";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        coin.size / 2,
        0,
        Math.PI * 2
    );

    ctx.fill();

    // Inner circle
    ctx.shadowBlur = 0;

    ctx.fillStyle = "#ffb300";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        coin.size / 2 - 5,
        0,
        Math.PI * 2
    );

    ctx.fill();

    // ₹ symbol
    ctx.fillStyle = "#fff4a3";

    ctx.font = "bold 18px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText("₹", 0, 1);

    ctx.restore();
}


function spawnEnemy() {

    const roadLeft = W * 0.15;
    const roadWidth = W * 0.70;

    const lanes = [
        roadLeft + roadWidth * 0.18,
        roadLeft + roadWidth * 0.50,
        roadLeft + roadWidth * 0.82
    ];

    const lane =
        lanes[Math.floor(Math.random() * lanes.length)];

    enemies.push({

        x: lane - 25,

        y: -110,

        width: 50,

        height: 90,

        color: [
            "#ff1744",
            "#ff9800",
            "#9c27b0",
            "#00c853",
            "#ff00aa",
            "#00b8ff",
            "#795548",
            "#e6ff00",
            "#673ab7"
        ][
            Math.floor(Math.random() * 9)
        ]
    });
}


function spawnCoin() {

    const roadLeft = W * 0.15;
    const roadWidth = W * 0.70;

    const lanes = [
        roadLeft + roadWidth * 0.18,
        roadLeft + roadWidth * 0.50,
        roadLeft + roadWidth * 0.82
    ];

    const lane =
        lanes[Math.floor(Math.random() * lanes.length)];

    coinObjects.push({

        x: lane - 15,

        y: -40,

        size: 30,

        rotation: 0
    });
}



function spawnPowerUp() {
    const roadLeft = W * 0.15;
    const roadWidth = W * 0.70;
    const lanes = [
        roadLeft + roadWidth * 0.18,
        roadLeft + roadWidth * 0.50,
        roadLeft + roadWidth * 0.82
    ];
    const types = ["shield", "boost", "life"];
    const type = types[Math.floor(Math.random() * types.length)];
    coinObjects.push({
        x: lanes[Math.floor(Math.random() * lanes.length)] - 17,
        y: -45,
        size: 34,
        rotation: 0,
        powerup: type
    });
}

function drawPowerUp(p) {
    ctx.save();
    ctx.translate(p.x + p.size / 2, p.y + p.size / 2);
    ctx.shadowBlur = 18;
    ctx.shadowColor = p.powerup === "shield" ? "#00e5ff" :
                      p.powerup === "boost" ? "#ff3d00" : "#69f0ae";
    ctx.fillStyle = ctx.shadowColor;
    ctx.beginPath();
    ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#071a12";
    ctx.font = "bold 20px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(p.powerup === "shield" ? "🛡" : p.powerup === "boost" ? "⚡" : "❤", 0, 1);
    ctx.restore();
}

function beep(freq = 440, duration = 0.07) {
    try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        osc.type = "square";
        gain.gain.value = 0.035;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}

function collision(a, b) {

    const padding = 8;

    return (

        a.x + padding <
        b.x + b.width - padding &&

        a.x + a.width - padding >
        b.x + padding &&

        a.y + padding <
        b.y + b.height - padding &&

        a.y + a.height - padding >
        b.y + padding
    );
}


function coinCollision(car, coin) {

    return (

        car.x < coin.x + coin.size &&

        car.x + car.width >
        coin.x &&

        car.y < coin.y + coin.size &&

        car.y + car.height >
        coin.y
    );
}


function update() {

    if (!gameRunning) {
        return;
    }


    // Player movement
    if (keys.left) {
        player.x -= player.speed;
    }

    if (keys.right) {
        player.x += player.speed;
    }


    // Keep car on road
    const roadLeft = W * 0.15;
    const roadRight = W * 0.85;

    if (player.x < roadLeft + 8) {

        player.x =
            roadLeft + 8;
    }

    if (
        player.x + player.width >
        roadRight - 8
    ) {

        player.x =
            roadRight -
            player.width -
            8;
    }


    // Road movement
    roadOffset += speed;


    // Enemy spawn
    spawnTimer--;

    if (spawnTimer <= 0) {

        spawnEnemy();

        spawnTimer =
            Math.max(
                22,
                65 - speed * 5
            );
    }


    // Coin spawn
    coinTimer--;

    if (coinTimer <= 0) {

        spawnCoin();

        coinTimer =
            45 + Math.random() * 35;
    }


    // Move enemies
    for (
        let i = enemies.length - 1;
        i >= 0;
        i--
    ) {

        const enemy = enemies[i];

        enemy.y += speed;


        // Crash
        if (collision(player, enemy) && invincibleTimer <= 0) {
            if (shieldTimer > 0) {
                shieldTimer = 0;
                invincibleTimer = 75;
                enemies.splice(i, 1);
                score += 25;
                beep(220, 0.14);
                continue;
            }

            lives--;
            livesText.textContent = lives;
            invincibleTimer = 90;
            beep(120, 0.18);
            enemies.splice(i, 1);

            if (lives <= 0) {
                endGame();
                return;
            }
        }


        // Passed enemy
        if (enemy.y > H + 120) {

            enemies.splice(i, 1);
        }
    }


    // Move coins
    for (
        let i = coinObjects.length - 1;
        i >= 0;
        i--
    ) {

        const coin =
            coinObjects[i];

        coin.y += speed;

        coin.rotation += 0.08;


        // Collect coin / power-up
        if (coinCollision(player, coin)) {
            coinObjects.splice(i, 1);

            if (coin.powerup) {
                if (coin.powerup === "shield") shieldTimer = 900;
                if (coin.powerup === "boost") speedBoostTimer = 420;
                if (coin.powerup === "life") lives = Math.min(5, lives + 1);
                livesText.textContent = lives;
                score += 50;
                beep(880, 0.12);
            } else {
                coins++;
                score += 50;
                coinsText.textContent = coins;
                savedCoins++;
                localStorage.setItem("totalCoins", savedCoins);
                beep(660, 0.07);
            }
            scoreText.textContent = score;
            continue;
        }


        if (coin.y > H + 50) {

            coinObjects.splice(i, 1);
        }
    }


    // FAST SCORE
    // Every frame score increases
    score += 1;

    scoreText.textContent =
        score;


    // Timers
    if (shieldTimer > 0) shieldTimer--;
    if (speedBoostTimer > 0) speedBoostTimer--;
    if (invincibleTimer > 0) invincibleTimer--;

    // Level system: every 500 points
    const newLevel = Math.floor(score / 500) + 1;
    if (newLevel > level) {
        level = newLevel;
        beep(1040, 0.18);
        levelText.textContent = level;
    }

    // Faster game as level increases
    const baseSpeed = 7 + upgradeSpeed * 1.5 + (level - 1) * 0.65;
    speed = Math.min(20, baseSpeed + (speedBoostTimer > 0 ? 5 : 0));

    // More frequent coins and enemies
    if (Math.random() < 0.008) spawnPowerUp();

    // Shield visual / car blink
    if (invincibleTimer > 0 && Math.floor(invincibleTimer / 6) % 2 === 0) {
        // visual handled in draw()
    }
}


function draw() {

    drawBackground();

    // Coins
    coinObjects.forEach(
        drawCoin
    );

    // Player
    if (shieldTimer > 0) {
        ctx.save();
        ctx.strokeStyle = "#00e5ff";
        ctx.lineWidth = 4;
        ctx.shadowColor = "#00e5ff";
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.arc(player.x + player.width / 2, player.y + player.height / 2,
                Math.max(player.width, player.height) * 0.68, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }

    drawCar(
        player,
        "#00e5ff"
    );

    // Enemies
    enemies.forEach(
        enemy =>
            drawCar(
                enemy,
                enemy.color
            )
    );
}


function gameLoop() {

    if (!gameRunning) {
        return;
    }

    if (!paused) {
        update();
        draw();
    }

    if (gameRunning) requestAnimationFrame(gameLoop);
    return;

    update();

}


function endGame() {

    gameRunning = false;

    finalScore.textContent =
        score;

    finalCoins.textContent =
        coins;


    if (score > best) {

        best = score;

        localStorage.setItem(
            "neonBest",
            best
        );

        bestText.textContent =
            best;
    }


    message.style.display =
        "block";
}


// Keyboard controls
window.addEventListener(
    "keydown",
    e => {

        if (
            e.key === "ArrowLeft" ||
            e.key.toLowerCase() === "a"
        ) {

            keys.left = true;
        }

        if (
            e.key === "ArrowRight" ||
            e.key.toLowerCase() === "d"
        ) {

            keys.right = true;
        }
    }
);


window.addEventListener(
    "keyup",
    e => {

        if (
            e.key === "ArrowLeft" ||
            e.key.toLowerCase() === "a"
        ) {

            keys.left = false;
        }

        if (
            e.key === "ArrowRight" ||
            e.key.toLowerCase() === "d"
        ) {

            keys.right = false;
        }
    }
);


// Mobile controls
const leftBtn =
    document.getElementById("left");

const rightBtn =
    document.getElementById("right");


leftBtn.addEventListener(
    "pointerdown",
    e => {

        e.preventDefault();

        keys.left = true;
    }
);

leftBtn.addEventListener(
    "pointerup",
    () => {

        keys.left = false;
    }
);
leftBtn.addEventListener("pointercancel", () => keys.left = false);

leftBtn.addEventListener(
    "pointerleave",
    () => {

        keys.left = false;
    }
);


rightBtn.addEventListener(
    "pointerdown",
    e => {

        e.preventDefault();

        keys.right = true;
    }
);

rightBtn.addEventListener(
    "pointerup",
    () => {

        keys.right = false;
    }
);
rightBtn.addEventListener("pointercancel", () => keys.right = false);

rightBtn.addEventListener(
    "pointerleave",
    () => {

        keys.right = false;
    }
);



function togglePause() {
    if (!gameRunning) return;
    paused = !paused;
    pauseBtn.textContent = paused ? "▶️" : "⏸️";
    pauseOverlay.style.display = paused ? "flex" : "none";
    beep(paused ? 240 : 520, 0.06);
}

pauseBtn.addEventListener("click", togglePause);

shopBtn.addEventListener("click", () => {
    shopCoins.textContent = savedCoins;
    shop.style.display = "block";
    paused = true;
    pauseOverlay.style.display = "flex";
});

closeShop.addEventListener("click", () => {
    shop.style.display = "none";
    paused = false;
    pauseOverlay.style.display = "none";
});

document.querySelectorAll(".upgrade").forEach(btn => {
    btn.addEventListener("click", () => {
        const type = btn.dataset.upgrade;
        const prices = {speed: 25, lives: 40, shield: 60};
        const price = prices[type];

        if (savedCoins < price) {
            beep(100, 0.15);
            return;
        }

        savedCoins -= price;
        localStorage.setItem("totalCoins", savedCoins);

        if (type === "speed") {
            upgradeSpeed = Math.min(5, upgradeSpeed + 1);
            localStorage.setItem("upgradeSpeed", upgradeSpeed);
        }
        if (type === "lives") {
            upgradeLives = Math.min(2, upgradeLives + 1);
            localStorage.setItem("upgradeLives", upgradeLives);
        }
        if (type === "shield") {
            upgradeShield = 1;
            localStorage.setItem("upgradeShield", upgradeShield);
        }

        shopCoins.textContent = savedCoins;
        beep(900, 0.12);
    });
});

document.addEventListener("keydown", e => {
    if (e.key.toLowerCase() === "p" || e.key === "Escape") togglePause();
});

restart.addEventListener(
    "click",
    resetGame
);


// Start
resetGame();

</script>

</body>
</html>
