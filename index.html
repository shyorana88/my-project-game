<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Games</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    min-height: 100vh;
}

.header {
    text-align: center;
    padding: 35px 15px 25px;
}

.header h1 {
    font-size: 40px;
    margin-bottom: 10px;
}

.header p {
    color: #bbb;
    font-size: 18px;
}

.games-container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
}

.game-card {
    background: #222;
    border-radius: 18px;
    padding: 30px 20px;
    text-align: center;
    box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    transition: 0.2s;
}

.game-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.7);
}

.game-icon {
    font-size: 55px;
    margin-bottom: 15px;
}

.game-card h2 {
    font-size: 24px;
    margin-bottom: 20px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.btn {
    display: inline-block;
    text-decoration: none;
    color: white;
    padding: 12px 18px;
    border-radius: 9px;
    font-weight: bold;
    font-size: 15px;
    transition: 0.15s;
}

.btn:hover {
    transform: scale(1.05);
    opacity: 0.9;
}

.play {
    background: #00c853;
}

.download {
    background: #2979ff;
}

.follow {
    background: #ff1744;
    margin-top: 12px;
}

.loading {
    text-align: center;
    padding: 50px;
    color: #aaa;
    font-size: 18px;
}

.footer {
    text-align: center;
    padding: 35px 15px;
    color: #888;
    font-size: 14px;
}

@media (max-width: 600px) {
    .header h1 {
        font-size: 30px;
    }

    .games-container {
        padding: 15px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>🎮 My Games</h1>
    <p>Play • Download • Follow</p>
</div>

<div id="games" class="games-container">
    <div class="loading">
        ⏳ Games loading...
    </div>
</div>

<div class="footer">
    © 2026 My Games • All Rights Reserved
</div>

<script>

const username = "shyorana88";
const repository = "my-project-game";

const gamesBox = document.getElementById("games");

const icons = ["🎮", "🚗", "🔥", "🎯", "🏎️", "⚡", "👾", "🕹️"];

function makeGameName(filename) {

    let name = filename
        .replace(".html", "")
        .replace(/[-_]/g, " ");

    return name
        .replace(/\b\w/g, letter => letter.toUpperCase());
}

function getIcon(index) {
    return icons[index % icons.length];
}

async function loadGames() {

    try {

        const apiURL =
        `https://api.github.com/repos/${username}/${repository}/contents/`;

        const response = await fetch(apiURL);

        if (!response.ok) {
            throw new Error("GitHub API error");
        }

        const files = await response.json();

        const games = files.filter(file =>
            file.type === "file" &&
            file.name.toLowerCase().endsWith(".html") &&
            file.name.toLowerCase() !== "index.html"
        );

        gamesBox.innerHTML = "";

        if (games.length === 0) {

            gamesBox.innerHTML = `
                <div class="loading">
                    😕 Abhi koi game nahi mila.
                </div>
            `;

            return;
        }

        games.forEach((game, index) => {

            const card = document.createElement("div");

            card.className = "game-card";

            const gameName = makeGameName(game.name);

            card.innerHTML = `

                <div class="game-icon">
                    ${getIcon(index)}
                </div>

                <h2>${gameName}</h2>

                <div class="buttons">

                    <a
                        class="btn play"
                        href="${game.name}">
                        🎮 PLAY
                    </a>

                    <a
                        class="btn download"
                        href="${game.name}"
                        download>
                        ⬇ DOWNLOAD
                    </a>

                </div>

                <a
                    class="btn follow"
                    href="https://github.com/${username}/${repository}"
                    target="_blank">
                    ⭐ FOLLOW
                </a>
            `;

            gamesBox.appendChild(card);

        });

    } catch (error) {

        gamesBox.innerHTML = `
            <div class="loading">
                ❌ Games load nahi ho paaye.<br><br>
                GitHub repository check karo.
            </div>
        `;

        console.error(error);
    }
}

loadGames();

</script>

</body>
</html>
