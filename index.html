<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Game World 🎮</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    color: white;
    background: linear-gradient(135deg, #090979, #00d4ff);
    min-height: 100vh;
}

h1 {
    padding-top: 40px;
    font-size: 45px;
}

p {
    font-size: 20px;
}

.games {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 25px;
    margin: 40px auto;
    max-width: 1000px;
}

.game {
    width: 250px;
    padding: 30px 20px;
    border-radius: 20px;
    background: rgba(255,255,255,0.15);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.emoji {
    font-size: 60px;
}

button {
    border: none;
    border-radius: 30px;
    padding: 14px 25px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    background: white;
    color: #090979;
}

button:hover {
    transform: scale(1.08);
}
</style>
</head>

<body>

<h1>🎮 MY GAME WORLD 🎮</h1>
<p>Choose your game and start playing!</p>

<div class="games">

    <div class="game">
        <div class="emoji">🚗</div>
        <h2>Neon Car Dodge</h2>
        <p>Dodge cars and collect coins!</p>
        <button onclick="location.href='neon_car_dodge_upgraded%20(2).html'">
            PLAY GAME
        </button>
    </div>

    <div class="game">
        <div class="emoji">🎯</div>
        <h2>Papa Game</h2>
        <p>Play the Papa game!</p>
        <button onclick="location.href='papa.html'">
            PLAY GAME
        </button>
    </div>

    <div class="game">
        <div class="emoji">🎮</div>
        <h2>My Main Game</h2>
        <p>Play your main game!</p>
        <button onclick="location.href='index.html'">
            PLAY GAME
        </button>
    </div>

</div>

</body>
</html>
