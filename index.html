<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Games</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    min-height: 100vh;
}

.header {
    text-align: center;
    padding: 35px 15px 25px;
}

.header h1 {
    font-size: 38px;
    margin-bottom: 10px;
}

.header p {
    color: #bbb;
    font-size: 18px;
}

.games-container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
}

.game-card {
    background: #222;
    border-radius: 18px;
    padding: 30px 20px;
    text-align: center;
    box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    transition: transform 0.2s, box-shadow 0.2s;
}

.game-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.7);
}

.game-icon {
    font-size: 55px;
    margin-bottom: 15px;
}

.game-card h2 {
    font-size: 25px;
    margin-bottom: 22px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.btn {
    display: inline-block;
    text-decoration: none;
    color: white;
    padding: 12px 20px;
    border-radius: 9px;
    font-weight: bold;
    font-size: 16px;
    transition: transform 0.15s, opacity 0.15s;
}

.btn:hover {
    transform: scale(1.05);
    opacity: 0.9;
}

.play {
    background: #00c853;
}

.download {
    background: #2979ff;
}

.follow {
    background: #ff1744;
    margin-top: 12px;
}

.footer {
    text-align: center;
    padding: 35px 15px;
    color: #888;
    font-size: 14px;
}

/* Mobile */
@media (max-width: 600px) {
    .header h1 {
        font-size: 30px;
    }

    .games-container {
        padding: 15px;
    }

    .game-card {
        padding: 25px 15px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>🎮 My Games</h1>
    <p>Play • Download • Follow</p>
</div>

<div class="games-container">

    <!-- GAME 2 -->
    <div class="game-card">
        <div class="game-icon">🎯</div>
        <h2>Game 2</h2>

        <div class="buttons">
            <a class="btn play" href="game2.html">
                🎮 PLAY
            </a>

            <a class="btn download" href="game2.html" download>
                ⬇ DOWNLOAD
            </a>
        </div>

        <a class="btn follow" href="https://github.com/shyorana88/my-project-game" target="_blank">
            ✅ FOLLOW
        </a>
    </div>


    <!-- GAME 3 -->
    <div class="game-card">
        <div class="game-icon">🚗</div>
        <h2>Neon Car Dodge</h2>

        <div class="buttons">
            <a class="btn play" href="game3.html">
                🎮 PLAY
            </a>

            <a class="btn download" href="game3.html" download>
                ⬇ DOWNLOAD
            </a>
        </div>

        <a class="btn follow" href="https://github.com/shyorana88/my-project-game" target="_blank">
            ✅ FOLLOW
        </a>
    </div>


    <!-- GAME 4 -->
    <div class="game-card">
        <div class="game-icon">🔥</div>
        <h2>Game 4</h2>

        <div class="buttons">
            <a class="btn play" href="game4.html">
                🎮 PLAY
            </a>

            <a class="btn download" href="game4.html" download>
                ⬇ DOWNLOAD
            </a>
        </div>

        <a class="btn follow" href="https://github.com/shyorana88/my-project-game" target="_blank">
            ✅ FOLLOW
        </a>
    </div>

</div>

<div class="footer">
    © 2026 My Games • All Rights Reserved
</div>

</body>
</html>
