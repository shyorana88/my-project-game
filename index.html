<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Games</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    text-align: center;
}

h1 {
    margin: 30px 0 10px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 30px;
}

.games {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    padding: 20px;
}

.game {
    background: #222;
    width: 280px;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 0 15px #000;
}

.game h2 {
    margin-top: 0;
}

button, a {
    display: inline-block;
    margin: 6px;
    padding: 10px 15px;
    border-radius: 8px;
    border: none;
    text-decoration: none;
    cursor: pointer;
    font-weight: bold;
}

.play {
    background: #00c853;
    color: white;
}

.download {
    background: #2979ff;
    color: white;
}

.follow {
    background: #ff1744;
    color: white;
}

button:hover, a:hover {
    transform: scale(1.05);
}
</style>
</head>

<body>

<h1>🎮 My Games</h1>
<p class="subtitle">Play • Download • Follow</p>

<div class="games">

    <!-- GAME 1 -->
    <div class="game">
        <h2>🚗 Neon Car Dodge</h2>

        <a class="play" href="game.html">🎮 PLAY</a>

        <a class="download" href="game.html" download>
            ⬇️ DOWNLOAD
        </a>

        <button class="follow" onclick="followGame(this)">
            ⭐ FOLLOW
        </button>
    </div>


    <!-- GAME 2 -->
    <div class="game">
        <h2>🎯 Game 2</h2>

        <a class="play" href="game2.html">🎮 PLAY</a>

        <a class="download" href="game2.html" download>
            ⬇️ DOWNLOAD
        </a>

        <button class="follow" onclick="followGame(this)">
            ⭐ FOLLOW
        </button>
    </div>


    <!-- GAME 3 -->
    <div class="game">
        <h2>🔥 Game 3</h2>

        <a class="play" href="game3.html">🎮 PLAY</a>

        <a class="download" href="game3.html" download>
            ⬇️ DOWNLOAD
        </a>

        <button class="follow" onclick="followGame(this)">
            ⭐ FOLLOW
        </button>
    </div>

</div>

<script>

function followGame(button) {

    if (button.innerText === "⭐ FOLLOW") {
        button.innerText = "✅ FOLLOWING";
        localStorage.setItem("following", "yes");
    } 
    else {
        button.innerText = "⭐ FOLLOW";
        localStorage.removeItem("following");
    }

}

</script>

</body>
</html>
